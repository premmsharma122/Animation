<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw the boundary around one piece of work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C1E29;--ink2:#102A38;--ink3:#1C3F52;--line:#27556C;
--fg:#DDE9EF;--dim:#8DA7B5;--faint:#5C7C8C;--go:#4FC2A4;--wait:#EDA83C;--stop:#E4645F;--accent:#79D2E8;--human:#B398EE;
--fdisp:"Familjen Grotesk",Georgia,serif;--fbody:"IBM Plex Sans",system-ui,sans-serif;--fmono:"IBM Plex Mono",monospace;}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--fbody);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.bar{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 26px 12px;border-bottom:1px solid var(--ink3);background:var(--ink2)}
.bar h1{font-family:var(--fdisp);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em}
.bar .ref{font-size:13px;color:var(--dim)}.bar .ref b{color:var(--accent)}
.viz{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 20px}
svg{width:100%;height:100%;display:block}
.rail{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px 14px;border-top:1px solid var(--ink3);background:var(--ink2)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.obtn{font-family:var(--fbody);cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:var(--ink);color:var(--fg);text-align:left;transition:border-color .2s,background .2s;max-width:230px}
.obtn:hover{border-color:var(--accent)}
.obtn b{display:block;font-size:13.5px;font-weight:600}
.obtn span{font-size:11px;color:var(--dim);line-height:1.25;display:block}
.obtn.sel{border-color:var(--accent);background:rgba(121,210,232,.08)}
.obtn.sel.ok{border-color:var(--go);background:rgba(79,194,164,.08)}
.cap{flex:1 1 200px;min-width:0;font-size:14.5px;line-height:1.35;color:var(--dim)}
.cap b{color:#fff;font-weight:600}
text{font-family:var(--fbody);fill:var(--dim)}
.evt circle{transition:opacity .4s,stroke .4s,fill .4s}
.evt text{font-size:11.5px;transition:opacity .4s,fill .4s}
.evt.out circle{opacity:.22}.evt.out text{opacity:.25}
.evt.lit circle{fill:var(--accent);stroke:var(--accent)}
.evt.lit text{fill:var(--fg)}
.ghost circle{stroke-dasharray:4 4;opacity:.4}.ghost text{opacity:.4;font-style:italic}
.axis{stroke:var(--ink3);stroke-width:2}
.frame{fill:rgba(121,210,232,.06);stroke:var(--accent);stroke-width:2;transition:x .6s cubic-bezier(.3,.7,.3,1),width .6s cubic-bezier(.3,.7,.3,1),opacity .4s,stroke .4s,fill .4s}
.frame.bad{stroke:var(--stop);fill:rgba(228,100,95,.06)}
.frame.good{stroke:var(--go);fill:rgba(79,194,164,.08)}
.chev{fill:var(--stop);opacity:0;transition:opacity .4s}
.chev.on{opacity:1}
.chk{opacity:0;transition:opacity .5s}.chk.on{opacity:1}
.chk text{font-size:12px;fill:var(--go);font-family:var(--fmono)}
.chk line{stroke:var(--go);stroke-width:1.5;stroke-dasharray:3 3}
@media (max-width:820px){.bar{padding:10px 16px}.bar h1{font-size:17px}.cap{order:3;flex-basis:100%}.obtn{max-width:none;flex:1 1 44%}}
@media (prefers-reduced-motion:reduce){.frame{transition:opacity .01ms}}
</style>
</head>
<body>
<header class="bar"><h1>Draw the boundary</h1>
<span class="ref">FDE Class 3 &middot; <b>Section 4</b> &middot; Choosing one unit of work</span></header>

<div class="viz">
<svg id="svg" viewBox="0 0 980 420" role="img" aria-label="A timeline of support events with a selectable boundary frame">
  <!-- boundary frame (behind nodes) -->
  <rect id="frame" class="frame" x="120" y="150" width="640" height="120" rx="12" opacity="0"></rect>
  <!-- overflow chevrons -->
  <g id="chevL" class="chev"><path d="M40 210 l22 -16 v32 z"></path><path d="M70 210 l22 -16 v32 z"></path></g>
  <g id="chevR" class="chev"><path d="M940 210 l-22 -16 v32 z"></path><path d="M910 210 l-22 -16 v32 z"></path></g>

  <!-- axis -->
  <line class="axis" x1="60" y1="210" x2="900" y2="210"></line>

  <!-- events -->
  <g class="evt" id="e0" data-x="120"><circle cx="120" cy="210" r="9" fill="var(--ink2)" stroke="var(--line)" stroke-width="2"></circle><text x="120" y="188" text-anchor="middle">everything else</text><text x="120" y="240" text-anchor="middle" font-size="10.5">support does</text></g>
  <g class="evt" id="e1" data-x="240"><circle cx="240" cy="210" r="9" fill="var(--ink2)" stroke="var(--line)" stroke-width="2"></circle><text x="240" y="188" text-anchor="middle">question</text><text x="240" y="240" text-anchor="middle" font-size="10.5">recorded</text></g>
  <g class="evt" id="e2" data-x="360"><circle cx="360" cy="210" r="9" fill="var(--ink2)" stroke="var(--line)" stroke-width="2"></circle><text x="360" y="188" text-anchor="middle">order read</text></g>
  <g class="evt" id="e3" data-x="470"><circle cx="470" cy="210" r="9" fill="var(--ink2)" stroke="var(--line)" stroke-width="2"></circle><text x="470" y="188" text-anchor="middle">issue read</text></g>
  <g class="evt" id="e4" data-x="560"><circle cx="560" cy="210" r="11" fill="var(--ink2)" stroke="var(--wait)" stroke-width="2.5"></circle><text x="560" y="184" text-anchor="middle" fill="var(--wait)">model call</text><text x="560" y="242" text-anchor="middle" font-size="10.5" fill="var(--wait)">prompt &rarr; JSON</text></g>
  <g class="evt" id="e5" data-x="670"><circle cx="670" cy="210" r="9" fill="var(--ink2)" stroke="var(--line)" stroke-width="2"></circle><text x="670" y="188" text-anchor="middle">human sees</text><text x="670" y="240" text-anchor="middle" font-size="10.5">draft</text></g>
  <g class="evt" id="e6" data-x="760"><circle cx="760" cy="210" r="9" fill="var(--ink2)" stroke="var(--line)" stroke-width="2"></circle><text x="760" y="188" text-anchor="middle">decision</text><text x="760" y="240" text-anchor="middle" font-size="10.5">recorded</text></g>
  <g class="evt ghost" id="e7" data-x="880"><circle cx="880" cy="210" r="9" fill="var(--ink2)" stroke="var(--stop)" stroke-width="2"></circle><text x="880" y="188" text-anchor="middle" fill="var(--stop)">refund paid</text><text x="880" y="240" text-anchor="middle" font-size="10.5" fill="var(--stop)">never happens</text></g>

  <!-- checkpoints for B -->
  <g id="checks">
    <g class="chk" id="ck1"><line x1="240" y1="150" x2="240" y2="120"></line><text x="240" y="112" text-anchor="middle">trigger</text></g>
    <g class="chk" id="ck2"><line x1="560" y1="270" x2="560" y2="304"></line><text x="560" y="320" text-anchor="middle">work item</text></g>
    <g class="chk" id="ck3"><line x1="670" y1="150" x2="670" y2="120"></line><text x="670" y="112" text-anchor="middle">decision point</text></g>
    <g class="chk" id="ck4"><line x1="760" y1="270" x2="760" y2="304"></line><text x="760" y="320" text-anchor="middle">end state</text></g>
  </g>
</svg>
</div>

<div class="rail">
  <div class="opts">
    <button class="obtn" data-opt="a"><b>A &middot; all of support</b><span>every activity the team performs</span></button>
    <button class="obtn" data-opt="c"><b>C &middot; one model call</b><span>prompt in, JSON out</span></button>
    <button class="obtn" data-opt="d"><b>D &middot; one refund</b><span>request to payment</span></button>
    <button class="obtn ok" data-opt="b"><b>B &middot; one support case</b><span>recorded question to recorded decision</span></button>
  </div>
  <p class="cap" id="cap">Pick a boundary. Watch what it catches &mdash; and what it misses.</p>
</div>

<script>
var frame=document.getElementById('frame'),cap=document.getElementById('cap');
var chevL=document.getElementById('chevL'),chevR=document.getElementById('chevR');
var checks=document.getElementById('checks');
var evts=[0,1,2,3,4,5,6,7].map(function(i){return document.getElementById('e'+i);});
function say(h){cap.innerHTML=h;}
function setFrame(x,w,cls){frame.setAttribute('x',x);frame.setAttribute('width',w);
  frame.setAttribute('opacity','1');frame.setAttribute('class','frame'+(cls?' '+cls:''));}
function inFrame(x){var fx=+frame.getAttribute('x'),fw=+frame.getAttribute('width');return x>=fx-4&&x<=fx+fw+4;}
function refresh(){evts.forEach(function(g){
  if(g.classList.contains('ghost'))return;
  var x=+g.dataset.x;g.classList.toggle('out',!inFrame(x));g.classList.toggle('lit',inFrame(x));});}
function showChecks(on){['ck1','ck2','ck3','ck4'].forEach(function(id){document.getElementById(id).classList.toggle('on',on);});}
function chev(l,r){chevL.classList.toggle('on',l);chevR.classList.toggle('on',r);}

function pick(opt){
  document.querySelectorAll('.obtn').forEach(function(b){b.classList.toggle('sel',b.dataset.opt===opt);});
  showChecks(false);chev(false,false);
  evts[7].classList.toggle('lit',false);
  if(opt==='a'){
    setFrame(-40,1060,'bad');chev(true,true);
    say('<b>A runs off both edges.</b> There is no single start or finish, and no one could follow all of it in a class.');
    setTimeout(refresh,50);
  } else if(opt==='c'){
    setFrame(536,48,'bad');
    say('<b>C is measurable and too small.</b> Watch the evidence before it and the human after it fall outside the frame &mdash; the parts that decide whether the answer is safe.');
    setTimeout(refresh,50);
  } else if(opt==='d'){
    setFrame(200,720,'bad');
    say('<b>D ends on an event that never happens.</b> Class 2 approves no refund, so the boundary&rsquo;s right edge points at empty space.');
    setTimeout(function(){refresh();evts[7].classList.remove('out');},50);
  } else {
    setFrame(210,590,'good');
    say('<b>B holds the prototype and still ends at a person.</b> Two endpoints anyone can point to: recorded question in, recorded decision out.');
    setTimeout(function(){refresh();showChecks(true);},50);
  }
}
document.querySelectorAll('.obtn').forEach(function(b){b.addEventListener('click',function(){pick(b.dataset.opt);});});
document.addEventListener('keydown',function(e){var m={a:'a',b:'b',c:'c',d:'d'};if(m[e.key.toLowerCase()])pick(m[e.key.toLowerCase()]);});
</script>
</body>
</html>
