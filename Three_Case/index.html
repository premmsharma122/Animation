<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run a case down the line and watch where it stops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C1E29;--ink2:#102A38;--ink3:#1C3F52;--line:#27556C;
--fg:#DDE9EF;--dim:#8DA7B5;--faint:#5C7C8C;--go:#4FC2A4;--wait:#EDA83C;--stop:#E4645F;--accent:#79D2E8;--human:#B398EE;
--fdisp:"Familjen Grotesk",Georgia,serif;--fbody:"IBM Plex Sans",system-ui,sans-serif;--fmono:"IBM Plex Mono",monospace;}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--fbody);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.bar{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 26px 12px;border-bottom:1px solid var(--ink3);background:var(--ink2)}
.bar h1{font-family:var(--fdisp);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em}
.bar .ref{font-size:13px;color:var(--dim)}.bar .ref b{color:var(--accent)}
.viz{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 18px}
svg{width:100%;height:100%;display:block}
.rail{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px 14px;border-top:1px solid var(--ink3);background:var(--ink2)}
.cases{display:flex;gap:8px}
.cbtn{font-family:var(--fbody);cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 14px;background:var(--ink);color:var(--fg);text-align:left;transition:border-color .2s,background .2s}
.cbtn:hover{border-color:var(--accent)}
.cbtn b{display:block;font-size:14px;font-weight:600}
.cbtn span{font-size:11.5px;color:var(--dim)}
.cbtn.sel.c1{border-color:var(--go);background:rgba(79,194,164,.08)}
.cbtn.sel.c2{border-color:var(--wait);background:rgba(237,168,60,.08)}
.cbtn.sel.c3{border-color:var(--stop);background:rgba(228,100,95,.08)}
.cap{flex:1 1 240px;min-width:0;font-size:14.5px;line-height:1.35;color:var(--dim)}
.cap b{color:#fff;font-weight:600}
.ctrl{display:flex;gap:8px;margin-left:auto}
.ctrl button{font-family:var(--fbody);font-size:14px;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--ink3);color:var(--fg);transition:background .15s,opacity .15s}
.ctrl button:hover:not(:disabled){background:var(--line)}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl button.key{background:var(--accent);border-color:var(--accent);color:#06222C}
.ctrl button.key:hover{background:#9BE0F1}
text{font-family:var(--fbody);fill:var(--dim)}
.belt{stroke:var(--ink3);stroke-width:2}
.gate rect{transition:y .35s cubic-bezier(.3,.7,.3,1),fill .3s,stroke .3s}
.glab{font-size:12px;fill:var(--faint)}
.gname{font-family:var(--fmono);font-size:12px;fill:var(--dim)}
.bin{fill:none;stroke-width:1.5;stroke-dasharray:6 6}
@media (max-width:820px){.bar{padding:10px 16px}.bar h1{font-size:17px}.cap{order:3;flex-basis:100%}.ctrl{margin-left:0}}
@media (prefers-reduced-motion:reduce){.gate rect{transition:none}}
</style>
</head>
<body>
<header class="bar"><h1>Where does the case stop?</h1>
<span class="ref">FDE Class 3 &middot; <b>Sections 7 &amp; 10</b> &middot; C1 complete &middot; C2 missing &middot; C3 conflict</span></header>

<div class="viz">
<svg id="svg" viewBox="0 0 960 470" role="img" aria-label="A support case travelling along a policy pipeline">
  <!-- belt -->
  <line class="belt" x1="40" y1="150" x2="812" y2="150"></line>
  <!-- return lane for C2 -->
  <line class="belt" x1="120" y1="300" x2="812" y2="300" opacity=".5" stroke-dasharray="4 6"></line>

  <!-- gates -->
  <g class="gate" id="gP2">
    <rect x="210" y="72" width="14" height="156" rx="3" fill="var(--ink3)" stroke="var(--line)"></rect>
    <text class="gname" x="217" y="58" text-anchor="middle">P2</text>
    <text class="glab" x="217" y="248" text-anchor="middle">date present?</text>
  </g>
  <g class="gate" id="gP1">
    <rect x="378" y="72" width="14" height="156" rx="3" fill="var(--ink3)" stroke="var(--line)"></rect>
    <text class="gname" x="385" y="58" text-anchor="middle">P1</text>
    <text class="glab" x="385" y="248" text-anchor="middle">within two days?</text>
  </g>
  <g class="gate" id="gP3">
    <rect x="546" y="72" width="14" height="156" rx="3" fill="var(--ink3)" stroke="var(--line)"></rect>
    <text class="gname" x="553" y="58" text-anchor="middle">P3</text>
    <text class="glab" x="553" y="248" text-anchor="middle">record says open?</text>
  </g>
  <!-- P4 wall -->
  <g class="gate" id="gP4">
    <rect x="726" y="60" width="16" height="180" rx="3" fill="var(--ink3)" stroke="var(--line)"></rect>
    <text class="gname" x="734" y="46" text-anchor="middle">P4</text>
    <text class="glab" x="734" y="260" text-anchor="middle">draft only</text>
  </g>

  <!-- review tray -->
  <g id="tray">
    <rect class="bin" x="770" y="96" width="150" height="108" rx="10" stroke="var(--human)"></rect>
    <text x="845" y="128" text-anchor="middle" fill="var(--human)" font-size="13" font-weight="600">human review</text>
    <text x="845" y="150" text-anchor="middle" font-size="11.5" fill="var(--dim)">a person decides</text>
    <text x="845" y="168" text-anchor="middle" font-size="11.5" fill="var(--dim)">the next action</text>
  </g>
  <!-- customer zone beyond P4 -->
  <text x="734" y="300" text-anchor="middle" font-size="11.5" fill="var(--faint)">beyond here: the customer</text>

  <!-- needs-info bin -->
  <g id="niBin" opacity="0">
    <rect class="bin" x="118" y="322" width="360" height="96" rx="10" stroke="var(--wait)"></rect>
    <text x="345" y="352" text-anchor="middle" fill="var(--wait)" font-size="13" font-weight="600">NEEDS_INFORMATION</text>
    <text class="mono" x="345" y="376" text-anchor="middle" font-size="12" fill="var(--wait)" font-family="var(--fmono)">missing: delivery_date</text>
    <text x="345" y="398" text-anchor="middle" font-size="11.5" fill="var(--dim)">a named field, not a blank cell</text>
  </g>

  <!-- floating claim for C3 -->
  <g id="claim" opacity="0">
    <text x="0" y="0" text-anchor="middle" font-size="11.5" fill="var(--human)">customer asks: &ldquo;confirm resolved&rdquo;</text>
  </g>

  <!-- token -->
  <g id="token" opacity="0">
    <rect x="-55" y="122" width="110" height="56" rx="8" fill="var(--ink2)" stroke="var(--accent)" stroke-width="1.5"></rect>
    <text id="tId" x="0" y="140" text-anchor="middle" font-family="var(--fmono)" font-size="12" fill="var(--fg)">C1</text>
    <text id="tDate" x="0" y="156" text-anchor="middle" font-size="10.5" fill="var(--dim)">date &middot; ok</text>
    <text id="tStat" x="0" y="170" text-anchor="middle" font-size="10.5" fill="var(--dim)">status &middot; open</text>
    <text id="tStamp" x="0" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="var(--go)" opacity="0"></text>
  </g>
</svg>
</div>

<div class="rail">
  <div class="cases">
    <button class="cbtn c1 sel" data-case="c1"><b>C1</b><span>complete</span></button>
    <button class="cbtn c2" data-case="c2"><b>C2</b><span>date missing</span></button>
    <button class="cbtn c3" data-case="c3"><b>C3</b><span>request vs record</span></button>
  </div>
  <p class="cap" id="cap">Pick a case and press <b>Run</b>. Same gates every time &mdash; only the case changes.</p>
  <div class="ctrl"><button id="run" class="key">Run</button><button id="reset">Reset</button></div>
</div>

<script>
var svg=document.getElementById('svg');
var token=document.getElementById('token');
var tId=document.getElementById('tId'),tDate=document.getElementById('tDate'),tStat=document.getElementById('tStat'),tStamp=document.getElementById('tStamp');
var cap=document.getElementById('cap'),run=document.getElementById('run');
var niBin=document.getElementById('niBin'),claim=document.getElementById('claim');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var gates={P2:g('gP2'),P1:g('gP1'),P3:g('gP3'),P4:g('gP4')};
function g(id){return document.getElementById(id).querySelector('rect');}
var GX={P2:217,P1:385,P3:553,P4:734};
var sel='c1',busy=false,pos={x:-55,y:150};

function setToken(c){
  var d={c1:['C1','date \u00b7 2026-09-12','status \u00b7 open'],
         c2:['C2','date \u00b7 null','status \u00b7 open'],
         c3:['C3','date \u00b7 2026-09-10','status \u00b7 open']}[c];
  tId.textContent=d[0];tDate.textContent=d[1];tStat.textContent=d[2];
  tDate.setAttribute('fill', c==='c2'?'var(--wait)':'var(--dim)');
}
function place(x,y){pos.x=x;pos.y=y;
  token.querySelector('rect').setAttribute('x',x-55);
  token.querySelector('rect').setAttribute('y',y-28);
  [tId,tDate,tStat,tStamp].forEach(function(t){t.setAttribute('x',x);});
  tId.setAttribute('y',y-10);tDate.setAttribute('y',y+6);tStat.setAttribute('y',y+20);
  tStamp.setAttribute('y',y-38);
}
function gateOpen(nm,open,color){
  var r=gates[nm];
  r.setAttribute('y',open?(nm==='P4'?60:72)-(open?170:0):(nm==='P4'?60:72));
  // move up out of the way when open
  r.setAttribute('y', open ? (nm==='P4'?-130:-110) : (nm==='P4'?60:72));
  r.setAttribute('stroke', color||'var(--line)');
  r.setAttribute('fill', color? 'rgba(79,194,164,.15)':'var(--ink3)');
}
function gateBlock(nm,color){
  var r=gates[nm];
  r.setAttribute('y', nm==='P4'?60:72);
  r.setAttribute('stroke',color);r.setAttribute('fill','rgba(228,100,95,.22)');
  r.setAttribute('width', nm==='P4'?16:20);
}
function resetGates(){
  ['P2','P1','P3','P4'].forEach(function(nm){
    var r=gates[nm];r.setAttribute('y',nm==='P4'?60:72);
    r.setAttribute('stroke','var(--line)');r.setAttribute('fill','var(--ink3)');
    r.setAttribute('width',nm==='P4'?16:14);
  });
}
function move(tx,ty,dur){return new Promise(function(res){
  var sx=pos.x,sy=pos.y,st=null;dur=reduce?1:dur;
  function s(ts){if(st===null)st=ts;var t=Math.min(1,(ts-st)/dur);var e=1-Math.pow(1-t,3);
    place(sx+(tx-sx)*e, sy+(ty-sy)*e);
    if(t<1)requestAnimationFrame(s);else res();}
  requestAnimationFrame(s);});}
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?1:ms);});}
function say(html){cap.innerHTML=html;}
function stamp(txt,color){tStamp.textContent=txt;tStamp.setAttribute('fill',color);tStamp.setAttribute('opacity','1');}

async function runCase(){
  if(busy)return;busy=true;run.disabled=true;
  fullReset(false);setToken(sel);token.setAttribute('opacity','1');place(-55,150);

  if(sel==='c1'){
    say('<b>C1</b> carries every fact a rule needs.');
    await move(150,150,700);
    say('P2 asks for the delivery date. It is present, so the gate lifts.');
    gateOpen('P2',true,'var(--go)');await move(GX.P2,150,500);await wait(350);
    await move(320,150,500);
    say('P1 &mdash; damage within two days. Answerable from the date. Passes.');
    gateOpen('P1',true,'var(--go)');await move(GX.P1,150,500);await wait(350);
    await move(490,150,500);
    say('P3 &mdash; the record says open, and the draft does not claim otherwise. Passes.');
    gateOpen('P3',true,'var(--go)');await move(GX.P3,150,500);await wait(350);
    await move(690,150,500);
    stamp('READY_FOR_HUMAN_REVIEW','var(--go)');
    say('<b>P4 is a wall, not a gate.</b> The case is stamped and handed to a person. It never reaches the customer on its own.');
    await wait(500);await move(700,150,300);await wait(300);
    await move(760,150,500);await move(845,150,600);
    say('<b>A clean run still stops at a human.</b> That is the point of the wall.');
  }

  else if(sel==='c2'){
    say('<b>C2</b> looks almost identical &mdash; but the delivery date is <b>null</b>.');
    await move(150,150,700);await wait(200);
    say('P2 asks for the date. There is none. The gate stays shut.');
    gateBlock('P2','var(--stop)');
    await move(190,150,400);
    // bump
    await move(178,150,150);await move(190,150,150);
    say('<b>Missing is not a blank to work around.</b> It is a state with a defined next step: name the field and hand the case back.');
    niBin.setAttribute('opacity','1');
    await move(190,240,450);await move(190,368,450);
    say('The draft asks for the date. No eligibility is assumed, no refund is guessed. In Meridian this rule lived only in a colleague&rsquo;s head.');
  }

  else{ // c3
    say('<b>C3</b> has every fact it needs. The problem is a disagreement.');
    claim.setAttribute('opacity','1');
    await move(150,150,700);
    // show claim following the token
    say('The customer asks us to confirm the issue is resolved &mdash; while the record says open. Two sources, one field.');
    await wait(400);
    say('P2 and P1 pass: the date is present and in range.');
    gateOpen('P2',true,'var(--go)');await move(GX.P2,150,450);
    gateOpen('P1',true,'var(--go)');await move(GX.P1,150,450);await wait(250);
    await move(500,150,450);
    say('<b>P3 does not choose the nicer answer.</b> It blocks the word &ldquo;resolved&rdquo; and keeps the authoritative status.');
    gateBlock('P3','var(--stop)');
    stamp('&#10007; resolved','var(--stop)');
    await wait(700);
    tStamp.innerHTML='';stamp('status: open (kept)','var(--wait)');
    // let it pass with clamp
    gateOpen('P3',true,'var(--go)');await move(GX.P3,150,450);await wait(250);
    await move(690,150,500);
    stamp('READY_FOR_HUMAN_REVIEW','var(--go)');
    say('The human sees the open status and the P3 reference, and decides. The request never overruled the record.');
    await wait(400);await move(760,150,500);await move(845,150,600);
    claim.setAttribute('opacity','0');
  }
  busy=false;run.disabled=false;
}

function fullReset(clearCap){
  resetGates();niBin.setAttribute('opacity','0');claim.setAttribute('opacity','0');
  tStamp.setAttribute('opacity','0');tStamp.innerHTML='';
  place(-55,150);token.setAttribute('opacity','0');
  if(clearCap)say('Pick a case and press <b>Run</b>. Same gates every time &mdash; only the case changes.');
}
document.querySelectorAll('.cbtn').forEach(function(b){b.addEventListener('click',function(){
  if(busy)return;sel=b.dataset.case;
  document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('sel');});
  b.classList.add('sel');fullReset(true);setToken(sel);
});});
run.addEventListener('click',runCase);
document.getElementById('reset').addEventListener('click',function(){if(!busy)fullReset(true);});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();runCase();}
  else if(e.key==='1'){document.querySelector('[data-case=c1]').click();}
  else if(e.key==='2'){document.querySelector('[data-case=c2]').click();}
  else if(e.key==='3'){document.querySelector('[data-case=c3]').click();}
  else if(e.key==='r'||e.key==='R'){if(!busy)fullReset(true);}
});
// claim follows token loosely for c3
setInterval(function(){
  if(sel==='c3'&&claim.getAttribute('opacity')==='1'){
    claim.querySelector('text').setAttribute('x',pos.x);
    claim.querySelector('text').setAttribute('y',pos.y-56);
  }
},30);
setToken('c1');
</script>
</body>
</html>
