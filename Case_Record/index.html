<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort the record: fact, suggestion, human</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C1E29;--ink2:#102A38;--ink3:#1C3F52;--line:#27556C;
--fg:#DDE9EF;--dim:#8DA7B5;--faint:#5C7C8C;--go:#4FC2A4;--wait:#EDA83C;--stop:#E4645F;--accent:#79D2E8;--human:#B398EE;
--fdisp:"Familjen Grotesk",Georgia,serif;--fbody:"IBM Plex Sans",system-ui,sans-serif;--fmono:"IBM Plex Mono",monospace;}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--fbody);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.bar{flex:0 0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 26px 12px;border-bottom:1px solid var(--ink3);background:var(--ink2)}
.bar h1{font-family:var(--fdisp);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em}
.bar .ref{font-size:13px;color:var(--dim)}.bar .ref b{color:var(--accent)}
.viz{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 20px}
svg{width:100%;height:100%;display:block}
.rail{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px 14px;border-top:1px solid var(--ink3);background:var(--ink2)}
.cap{flex:1 1 200px;min-width:0;font-size:14.5px;line-height:1.35;color:var(--dim)}
.cap b{color:#fff;font-weight:600}
.ctrl{display:flex;gap:8px;margin-left:auto}
.ctrl button{font-family:var(--fbody);font-size:14px;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--ink3);color:var(--fg);transition:background .15s,opacity .15s}
.ctrl button:hover:not(:disabled){background:var(--line)}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl button.key{background:var(--accent);border-color:var(--accent);color:#06222C}
.ctrl button.key:hover{background:#9BE0F1}
text{font-family:var(--fbody);fill:var(--dim)}
.bin{fill:none;stroke-width:1.5;stroke-dasharray:7 7}
.binlab{font-size:13px;font-weight:600}
.sub{font-size:11px;fill:var(--faint)}
@media (max-width:820px){.bar{padding:10px 16px}.bar h1{font-size:17px}.cap{order:3;flex-basis:100%}.ctrl{margin-left:0}}
</style>
</head>
<body>
<header class="bar"><h1>What kind of thing is each field?</h1>
<span class="ref">FDE Class 3 &middot; <b>Section 9</b> &middot; The Support Case Record</span></header>

<div class="viz">
<svg id="svg" viewBox="0 0 980 470" role="img" aria-label="Fields sorting into fact, suggestion and human-owned bins">
  <!-- bins -->
  <g id="binFact"><rect class="bin" x="40" y="150" width="290" height="280" rx="12" stroke="var(--go)"></rect>
    <text class="binlab" x="185" y="180" text-anchor="middle" fill="var(--go)">Facts</text>
    <text class="sub" x="185" y="200" text-anchor="middle">supplied by a named source</text></g>
  <g id="binGen"><rect class="bin" x="345" y="150" width="290" height="280" rx="12" stroke="var(--accent)"></rect>
    <text class="binlab" x="490" y="180" text-anchor="middle" fill="var(--accent)">Generated suggestions</text>
    <text class="sub" x="490" y="200" text-anchor="middle">proposed by the prototype</text></g>
  <g id="binHum"><rect class="bin" x="650" y="150" width="290" height="280" rx="12" stroke="var(--human)"></rect>
    <text class="binlab" x="795" y="180" text-anchor="middle" fill="var(--human)">Human-owned</text>
    <text class="sub" x="795" y="200" text-anchor="middle">no software writes here</text></g>

  <!-- emitter -->
  <text id="emit" x="490" y="70" text-anchor="middle" font-size="13" fill="var(--dim)">the fields the case needs</text>

  <g id="tokens"></g>
</svg>
</div>

<div class="rail">
  <p class="cap" id="cap">Every field is a fact, a suggestion or a human&rsquo;s decision. Press <b>Sort</b>.</p>
  <div class="ctrl"><button id="sort" class="key">Sort fields</button><button id="note" disabled>Then: the note problem</button><button id="reset">Reset</button></div>
</div>

<script>
var NS='http://www.w3.org/2000/svg';
var tokens=document.getElementById('tokens'),cap=document.getElementById('cap');
var bSort=document.getElementById('sort'),bNote=document.getElementById('note');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var busy=false,sorted=false;

var FIELDS=[
 {k:'case_id',bin:'F'},{k:'order_id',bin:'F'},{k:'product',bin:'F'},{k:'customer_question',bin:'F'},
 {k:'delivery_date',bin:'F'},{k:'issue_status',bin:'F'},{k:'issue_details',bin:'F'},{k:'policy_version',bin:'F'},
 {k:'draft_reply',bin:'G'},{k:'evidence_refs',bin:'G'},{k:'missing_information',bin:'G'},{k:'review_status',bin:'G'},
 {k:'human_review_decision',bin:'H'},{k:'reviewed_by',bin:'H'},{k:'reviewed_at',bin:'H'},{k:'final_action',bin:'H'}
];
var BINX={F:{x:55,color:'var(--go)'},G:{x:360,color:'var(--accent)'},H:{x:665,color:'var(--human)'}};
var count={F:0,G:0,H:0};

function token(txt,x,y,color,dashed){
  var g=document.createElementNS(NS,'g');
  var w=Math.max(96, txt.length*7.2+18);
  var r=document.createElementNS(NS,'rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',24);r.setAttribute('rx',6);
  r.setAttribute('fill','rgba(0,0,0,.25)');r.setAttribute('stroke',color);r.setAttribute('stroke-width','1.5');
  if(dashed)r.setAttribute('stroke-dasharray','5 4');
  var t=document.createElementNS(NS,'text');t.setAttribute('x',x+w/2);t.setAttribute('y',y+16);
  t.setAttribute('text-anchor','middle');t.setAttribute('font-family','var(--fmono)');t.setAttribute('font-size','11.5');
  t.setAttribute('fill',color);t.textContent=txt;
  g.appendChild(r);g.appendChild(t);tokens.appendChild(g);
  return {g:g,r:r,t:t,w:w};
}
function moveTo(o,tx,ty,dur){return new Promise(function(res){
  var sx=+o.r.getAttribute('x'),sy=+o.r.getAttribute('y'),st=null;dur=reduce?1:dur;
  function s(ts){if(st===null)st=ts;var t=Math.min(1,(ts-st)/dur);var e=1-Math.pow(1-t,3);
    var x=sx+(tx-sx)*e,y=sy+(ty-sy)*e;o.r.setAttribute('x',x);o.r.setAttribute('y',y);
    o.t.setAttribute('x',x+o.w/2);o.t.setAttribute('y',y+16);
    if(t<1)requestAnimationFrame(s);else res();}
  requestAnimationFrame(s);});}
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?1:ms);});}
function say(h){cap.innerHTML=h;}

async function doSort(){
  if(busy||sorted)return;busy=true;bSort.disabled=true;
  say('Each field drops into the bin that says what it is.');
  for(var i=0;i<FIELDS.length;i++){
    var f=FIELDS[i],b=BINX[f.bin],dashed=(f.bin==='G');
    var o=token(f.k, 440, 84, b.color, dashed);
    var col=count[f.bin]%1, row=count[f.bin];
    var ty=214+row*26;
    await moveTo(o, b.x, ty, 360);
    count[f.bin]++;
    if(f.k==='delivery_date')say('One source is not authoritative for everything &mdash; the order date and the issue status come from different places.');
    if(f.k==='draft_reply')say('The prototype&rsquo;s output goes in its own bin, drawn dashed. A draft is a proposal, not proof anything happened.');
    if(f.k==='human_review_decision')say('And this bin is locked. The decision, the reviewer, the time, the next action &mdash; all a person&rsquo;s.');
    await wait(60);
  }
  say('<b>Facts, suggestions and human decisions never get mixed.</b> That separation is what keeps a draft from being read as a done outcome. Now press <b>the note problem</b>.');
  sorted=true;busy=false;bNote.disabled=false;
}

// ---- note clipping scene (full clean canvas) ----
async function doNote(){
  if(busy)return;busy=true;bNote.disabled=true;
  // clear the sort scene entirely
  ['binFact','binGen','binHum'].forEach(function(id){document.getElementById(id).setAttribute('opacity','0');});
  tokens.setAttribute('opacity','0');
  document.getElementById('emit').setAttribute('opacity','0');

  var layer=document.createElementNS(NS,'g');layer.setAttribute('id','noteLayer');document.getElementById('svg').appendChild(layer);
  function txt(x,y,s,size,color,anchor,mono,weight){var t=document.createElementNS(NS,'text');
    t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('font-size',size);t.setAttribute('fill',color);
    t.setAttribute('text-anchor',anchor||'start');if(mono)t.setAttribute('font-family','var(--fmono)');
    if(weight)t.setAttribute('font-weight',weight);t.textContent=s;layer.appendChild(t);return t;}
  function rect(x,y,w,h,stroke,dash,fill){var r=document.createElementNS(NS,'rect');
    r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx',6);
    r.setAttribute('fill',fill||'rgba(0,0,0,.2)');r.setAttribute('stroke',stroke);r.setAttribute('stroke-width','1.5');
    if(dash)r.setAttribute('stroke-dasharray','5 4');layer.appendChild(r);return r;}

  txt(490,86,'Observation step 10: one note field, with a character limit.',14,'var(--dim)','middle',false,'600');

  // ---- PROBLEM: the free-text box that clips ----
  var boxX=110,boxW=470,boxY=150;
  txt(boxX,138,'what the agent could save',12,'var(--faint)');
  rect(boxX,boxY,boxW,44,'var(--stop)');
  var clip=document.createElementNS(NS,'clipPath');clip.setAttribute('id','noteClip');
  var cr=document.createElementNS(NS,'rect');cr.setAttribute('x',boxX+10);cr.setAttribute('y',boxY);cr.setAttribute('width',boxW-20);cr.setAttribute('height',44);
  clip.appendChild(cr);layer.appendChild(clip);
  var full='Return approved per policy \u2014 delivery 2026-09-12, issue open, P1 two-day rule, P3 no-resolved, CLASSROOM-1';
  var big=document.createElementNS(NS,'text');big.setAttribute('x',boxX+12);big.setAttribute('y',boxY+27);
  big.setAttribute('font-family','var(--fmono)');big.setAttribute('font-size','12.5');big.setAttribute('fill','var(--fg)');
  big.setAttribute('clip-path','url(#noteClip)');big.textContent=full;layer.appendChild(big);
  // fade edge to signal the cut
  txt(boxX+boxW-6,boxY+27,'\u2026',13,'var(--stop)','start',true);
  await wait(400);

  say('The reasoning is longer than the field allows. Everything past the edge is dropped.');
  await wait(700);
  var ghost=txt(boxX+14,boxY+92,'lost: the delivery date, the exact rules applied, the policy version',12,'var(--stop)','start',true);
  await (function(){return new Promise(function(res){var st=null;function s(ts){if(st===null)st=ts;var t=Math.min(1,(ts-st)/(reduce?1:1000));
    ghost.setAttribute('y',boxY+92+t*40);ghost.setAttribute('opacity',1-t*0.9);if(t<1)requestAnimationFrame(s);else res();}requestAnimationFrame(s);});})();
  say('<b>Even when the decision was right, the reason for it is gone.</b> That is why a tool built for the tidy process gets rejected by the people doing the real one.');
  await wait(300);

  // ---- FIX: structured fields that each fit ----
  var sy=290;
  txt(boxX,sy-14,'the record keeps each reason as its own field \u2014 nothing is clipped',12.5,'var(--go)',null,false,'600');
  var chips=['delivery_date: 2026-09-12','P1: two-day rule','P3: not resolved','policy_version: CLASSROOM-1'];
  var cx=boxX;
  for(var i=0;i<chips.length;i++){
    var w=chips[i].length*7+20;
    var r=rect(cx,sy,w,28,'var(--go)',false,'rgba(79,194,164,.1)');r.setAttribute('opacity','0');
    var t=txt(cx+w/2,sy+18,chips[i],11.5,'var(--go)','middle',true);t.setAttribute('opacity','0');
    (function(rr,tt){setTimeout(function(){rr.setAttribute('opacity','1');tt.setAttribute('opacity','1');},reduce?0:i*160);})(r,t);
    cx+=w+12;
  }
  await wait(chips.length*160+300);

  // ---- R6 tie-in, its own row ----
  txt(490,392,'This is also request R6 \u2014 one place that shows what is missing for a case,',12.5,'var(--dim)','middle');
  txt(490,412,'asked for by the one person on the contact sheet with no formal authority.',12.5,'var(--faint)','middle');
  busy=false;
}

bSort.addEventListener('click',doSort);
bNote.addEventListener('click',doNote);
document.getElementById('reset').addEventListener('click',function(){location.reload();});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!sorted)doSort();else if(!bNote.disabled)doNote();}
  else if(e.key==='r'||e.key==='R'){location.reload();}});
</script>
</body>
</html>
